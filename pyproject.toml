[project]
name = "trylobite"
version = "0.1.0"
description = "A microkernel for detrytus, the balanced-ternary machine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["detrytus", "pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false  # the kernel is assembly; Python only builds and tests it

[tool.uv.sources]
# uv.lock pins the exact commit; `uv lock --upgrade-package detrytus` moves it.
detrytus = { git = "https://github.com/sgaduuw/detrytus", branch = "main" }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "TID", "C90", "N", "ARG"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
