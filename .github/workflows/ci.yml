name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Toolchain
        # rust-src and the target build the Rust programs of bin/ (docs/rust.md).
        run: |
          rustup toolchain install stable --profile minimal --component rust-src \
            --target riscv32imac-unknown-none-elf
      - name: Install detrytus
        run: tools/install-detrytus
      - run: uv sync
      - name: Lint
        run: uv run ruff check tests tools
      - name: Format
        run: uv run ruff format --check tests tools
      - name: Test
        run: uv run pytest
      - name: Boot the demo
        run: detrytus run demo.s --ram-pages 40
      - name: Boot the demo on three harts
        run: detrytus run demo.s --ram-pages 40 --harts 3
      - name: Run a shell session
        run: printf 'hello\nfail\npingpong\nexit\n' | detrytus run shell.s --ram-pages 81 --harts 3 --input -
      - name: Use files from the shell
        run: |
          printf 'hello, disk\n' > notes
          tools/fs.py new disk.img 40 notes bin/*.s bin/*.tc bin/*.rs
          tools/fs.py mkdir disk.img docs
          tools/fs.py put disk.img notes docs/again
          printf 'ls\nls bin\ncat notes\ncat docs/again\nwrite docs/motd made in the shell\ncd docs\npwd\ncat again\nhello\nhello > hi\ncat < hi\nhello | upper | wc\nrhello\nps\ndf\nuname -a\nexit\n' | detrytus run shell.s --ram-pages 81 --input - --disk disk.img | tee out.txt
          grep -q 'hello from a balanced-ternary machine' out.txt
          grep -qx 'hello from Rust on a balanced-ternary machine' out.txt
          grep -qx '/docs' out.txt
          grep -qx '1 5 38' out.txt
          grep -qE '^ +[0-9]+ +5 run +4 +[0-9]+ ps$' out.txt
          grep -qE '^disk0 +40 ' out.txt
          grep -qx 'trylobite 0.1.0 detrytus' out.txt
          tools/fs.py ls disk.img docs
          tools/fs.py cat disk.img docs/motd | grep -q 'made in the shell'
          tools/fs.py cat disk.img docs/hi | grep -q 'hello from a balanced-ternary machine'
