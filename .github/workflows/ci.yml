name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - name: Lint
        run: uv run ruff check tests
      - name: Format
        run: uv run ruff format --check tests
      - name: Test
        run: uv run pytest
      - name: Boot the demo
        run: uv run detrytus run demo.s --ram-pages 40

  rust-core:
    runs-on: ubuntu-latest
    env:
      DETRYTUS_BACKEND: rust
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - run: uv sync
      - name: Install detrytus' Rust core
        run: tools/install-rust-backend
      - name: Test
        run: uv run pytest
      - name: Boot the demo
        run: uv run detrytus run demo.s --ram-pages 40
