name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Toolchain
        # The release rust-toolchain.toml pins, with rust-src and the
        # target, builds the kernel's Rust and the programs of bin/.
        run: rustup toolchain install
      - name: Install detrytus
        run: tools/install-detrytus
      - run: uv sync
      - name: Build the kernel's Rust
        run: make kernel
      - name: Lint
        run: uv run ruff check tests tools
      - name: Format
        run: uv run ruff format --check tests tools
      - name: Test
        run: uv run pytest
      - name: Boot the demo
        run: detrytus run demo.s --ram-pages 40
      - name: Boot the demo on three harts
        run: detrytus run demo.s --ram-pages 40 --harts 3
      - name: Use files from the shell
        run: |
          printf 'hello, disk\n' > notes
          make BLOCKS=84
          tools/fs.py put disk.img notes
          tools/fs.py mkdir disk.img docs
          tools/fs.py put disk.img notes docs/again
          printf 'ls\nls bin\ncat notes\ncat docs/again\nwrite docs/motd made in the shell\ncd docs\npwd\ncat again\nhello\nhello > hi\ncat < hi\nhello | upper | wc\nps\ndf\nuname -a\nexit\n' | detrytus run shell.s --max-steps 50000000 --input - --disk disk.img | tee out.txt
          grep -q 'hello from a balanced-ternary machine' out.txt
          grep -qx '/docs' out.txt
          grep -qx '1 5 38' out.txt
          grep -qE '^ +[0-9]+ +9 run +4 +[0-9]+ ps$' out.txt  # sh is 9, after /etc/init's dhcp and ntpd
          grep -qE '^disk0 +84 ' out.txt
          grep -qx 'trylobite 0.1.0 detrytus' out.txt
          tools/fs.py ls disk.img docs
          tools/fs.py cat disk.img docs/motd | grep -q 'made in the shell'
          tools/fs.py cat disk.img docs/hi | grep -q 'hello from a balanced-ternary machine'
      - name: Run a shell session on three harts
        # The shell is /bin/sh: it needs the disk.
        run: printf 'hello\nfail\npingpong\nexit\n' | detrytus run shell.s --ram-pages 243 --harts 3 --input - --disk disk.img
      - name: Boot the shell from the disk
        run: |
          printf 'hello\nuname -a\nexit\n' | detrytus run --harts 3 --input - --disk disk.img | tee boot.txt
          grep -q '^trylobite: harts: 3$' boot.txt
          grep -qx 'trylobite 0.1.0 detrytus' boot.txt
      - name: Ping over a loopback link
        run: |
          printf 'ifconfig\nping 10.0.0.2 2\necho over udp | nc -u 10.0.0.2 7\necho over tcp | nc 10.0.0.2 7\nexit\n' | detrytus run shell.s --input - --disk disk.img --net loop | tee ping.txt
          grep -qx 'inet 10.0.0.2/24 gateway 10.0.0.1 nameserver 10.0.0.3' ping.txt
          grep -qE '^reply from 10\.0\.0\.2: seq 2, [0-9]+\.[0-9]{3} ms$' ping.txt
          grep -qx 'over udp' ping.txt
          grep -qx 'over tcp' ping.txt
